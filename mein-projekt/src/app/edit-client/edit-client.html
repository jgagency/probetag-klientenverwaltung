
<br>
<div class="mx-auto" style="max-width: 75%">
  <h3>{{ clientFormGroupService.displayVorname() }} {{ clientFormGroupService.displayNachname() }}</h3>
  <br>
  <form [formGroup]="clientFormGroupService.clientForm">
    <div class="btn-group" style="height: 40px" role="group" >
      <button type="button" (click)="edit()" class="btn" style="background-color: #0f2480; color: white"
              [disabled]="clientFormGroupService.clientForm.invalid"
      >Speichern</button>
      <button type="button" (click)="clientFormGroupService.resetClient()" class="btn btn-group-grey ms-1">Zurücksetzen</button>
      <button type="button" data-bs-target="#deleteModalToggle"  class="btn btn-danger ms-1" data-bs-toggle="modal">Löschen</button>
    </div>
    <br><br>
    <h3>Persönliche Daten</h3>
    <div class="row">
      <div class="col d-flex">
        <div class="mb-3 flex-grow-1">
          <label class="form-label">Vorname*</label>
          <input type="text" class="form-control" formControlName="vorname"
              [class.is-invalid]="clientFormGroupService.clientForm.get('vorname')?.invalid &&
              clientFormGroupService.clientForm.get('vorname')?.touched"
          >
          <app-form-errors [control]="clientFormGroupService.clientForm.get('vorname')"></app-form-errors>
        </div>
        <div class="ms-4 flex-grow-1">
          <label class="form-label">Nachname*</label>
          <input type="text" class="form-control" formControlName="nachname"
              [class.is-invalid]="clientFormGroupService.clientForm.get('nachname')?.invalid &&
              clientFormGroupService.clientForm.get('nachname')?.touched">
          <app-form-errors [control]="clientFormGroupService.clientForm.get('nachname')"></app-form-errors>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col d-flex">
        <div class="mb-3 flex-grow-1 w-50">
          <label class="form-label">Straße*</label>
          <input type="text" class="form-control" formControlName="strasse"
              [class.is-invalid]="clientFormGroupService.clientForm.get('strasse')?.invalid &&
              clientFormGroupService.clientForm.get('strasse')?.touched">
          <app-form-errors [control]="clientFormGroupService.clientForm.get('strasse')"></app-form-errors>

        </div>
        <div class="ms-4 d-flex flex-grow-1 w-50">
          <div class="flex-grow-1 w-25">
            <label class="form-label">PLZ*</label>
            <input type="text" class="form-control" formControlName="plz"
               [class.is-invalid]="clientFormGroupService.clientForm.get('plz')?.invalid &&
               clientFormGroupService.clientForm.get('plz')?.touched">
            <app-form-errors [control]="clientFormGroupService.clientForm.get('plz')"
              minLengthMessage="Zu kurz"
            ></app-form-errors>
          </div>
          <div class="flex-grow-1 ms-3 w-75">
            <label class="form-label">Ort*</label>
            <input type="text" class="form-control" formControlName="ort"
               [class.is-invalid]="clientFormGroupService.clientForm.get('ort')?.invalid &&
               clientFormGroupService.clientForm.get('ort')?.touched">
            <app-form-errors [control]="clientFormGroupService.clientForm.get('ort')"></app-form-errors>
          </div>
        </div>
      </div>
    </div>
    <div class="mb-2 flex-grow-1 w-25 justify-content-center">
      <label class="form-label mb-1">Geburtsdatum</label>
      <input type="text" class="form-control" formControlName="geburtsdatum" name="geburtsdatum" bsDatepicker [bsValue]="getDate()" [bsConfig]="bsConfig">
    </div>
    <div class="row">
      <div class="col d-flex">
        <div class="mb-3 flex-grow-1">
          <label class="form-label">Telefon</label>
          <input type="text" class="form-control" formControlName="telefon"
             [class.is-invalid]="clientFormGroupService.clientForm.get('telefon')?.invalid &&
             clientFormGroupService.clientForm.get('telefon')?.touched">
          <app-form-errors [control]="clientFormGroupService.clientForm.get('telefon')"
             patternMessage="Bitte eine gültige Telefonnummer eingeben."></app-form-errors>
        </div>
        <div class="ms-4 flex-grow-1">
          <label class="form-label">E-Mail-Adresse*</label>
          <input type="text" class="form-control" formControlName="email"
            [class.is-invalid]="clientFormGroupService.clientForm.get('email')?.invalid &&
            clientFormGroupService.clientForm.get('email')?.touched">
          <app-form-errors [control]="clientFormGroupService.clientForm.get('email')"></app-form-errors>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col d-flex">
        <div class="mb-3 flex-grow-1">
          <label class="form-label">Versicherungsnummer</label>
          <input type="text" class="form-control" formControlName="versicherungsnummer"
                 [class.is-invalid]="clientFormGroupService.clientForm.get('versicherungsnummer')?.invalid &&
               clientFormGroupService.clientForm.get('versicherungsnummer')?.touched"
          >
          <app-form-errors [control]="clientFormGroupService.clientForm.get('versicherungsnummer')"
                           minLengthMessage="Eine Versicherungsnummer hat zehn Ziffern."
                           maxLengthMessage="Eine Versicherungsnummer hat zehn Ziffern."
          ></app-form-errors>
        </div>
        <div class="ms-4 flex-grow-1">
          <label class="form-label">Versicherungsname</label>
          <input type="text" class="form-control" formControlName="versicherungsname"
                 [class.is-invalid]="clientFormGroupService.clientForm.get('versicherungsname')?.invalid &&
               clientFormGroupService.clientForm.get('versicherungsname')?.touched"
          >
          <app-form-errors [control]="clientFormGroupService.clientForm.get('versicherungsname')"></app-form-errors>
        </div>
      </div>
    </div>
  </form>
  <div class="modal fade" id="deleteModalToggle" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="deleteModalLabel">Achtung</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body mx-auto align-content-center">
          Du bist dabei diesen Klienten zu löschen!
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
          <button type="button" class="btn btn-danger" (click)="delete()" data-bs-dismiss="modal">Löschen</button>
        </div>
      </div>
    </div>
  </div>
</div>
