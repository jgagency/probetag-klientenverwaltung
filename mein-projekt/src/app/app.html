<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg shadow" style="background-color:#0f2485">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <a routerLink="">
          <img src="jg_logo_white.png" width="100" alt="Logo der J&G Agency">
        </a>
        <div class="d-flex align-items-center">
          <div class="me-4" style="color:white; cursor: pointer" routerLink="/nutzer/{{this.globalValues.userID()}}">{{this.globalValues.userName()}}</div>
          <a (click)="loginService.logOut()" style="cursor: pointer">
          <span style="color: white">
            <i class="fa-solid fa-arrow-right-from-bracket fa-xl me-2"></i>
          </span>
          </a>
        </div>
      </div>
    </nav>
    <div class="p-4 mx-auto" style="background-color: #f2f3f4">
      <app-breadcrumb-navigation></app-breadcrumb-navigation>
    </div>
  </header>
  <main>
    <router-outlet></router-outlet>
    <app-alerts></app-alerts>
  </main>
  <footer></footer>
</body>
</html>
