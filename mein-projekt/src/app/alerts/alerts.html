<br>
<div class="mx-auto" style="max-width: 75%">
  @if(alertService.alerts().length > 0){
    @for (alert of alertService.alerts(); track alert) {
      <div>
        <alert [type]="alert.type" [dismissible]="dismissible" [dismissOnTimeout]="alert.timeout" (onClosed)="alertService.onClosed(alert)">
          <i class="{{alert.icon}}" style="{{alert.style}}" ></i>
          {{ alert.msg }}
        </alert>
      </div>
    }
  }

</div>
